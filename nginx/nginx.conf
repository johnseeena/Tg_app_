# SNI router on :443 (Layer 4, TLS passthrough — no termination here).
#
# Why this exists: the user's mobile carrier blocks the VPN unless it's
# indistinguishable from ordinary HTTPS. That needs BOTH the standard port
# (443) AND a clean, never-blocked SNI (a big real site). But 443 is also
# where the Mini App lives, and REALITY's own fallback can only front ONE
# origin per serverName. So we split by SNI at the very front:
#   - SNI = the Mini App's own domain  -> Caddy (serves the Mini App)
#   - anything else (the VLESS clients' camouflage SNI, plus probes) -> xray
# ssl_preread reads the SNI from the ClientHello WITHOUT terminating TLS, so
# Caddy and xray still do their own TLS/REALITY exactly as before.

events {}

stream {
    map $ssl_preread_server_name $upstream {
        207-174-28-168.sslip.io  caddy_backend;
        default                  xray_backend;
    }

    upstream caddy_backend { server caddy:443; }
    upstream xray_backend  { server xray:443; }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $upstream;
        # VLESS sessions are long-lived; don't cut idle tunnels.
        proxy_timeout 1h;
    }
}
